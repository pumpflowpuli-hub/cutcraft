[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cutcraft"
version = "1.0.1"
description = "Автомонтаж видео и красивые субтитры: паузы, YouTube, караоке, 9:16"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "CutCraft" }]
keywords = ["video", "subtitles", "ffmpeg", "youtube", "shorts", "montage"]
dependencies = [
    "numpy>=1.24",
    "Pillow>=9.0",
]

[project.optional-dependencies]
youtube = ["yt-dlp>=2024.1.1"]

[project.scripts]
cutcraft = "cutcraft.cli:main"

[tool.setuptools.packages.find]
include = ["cutcraft*"]
